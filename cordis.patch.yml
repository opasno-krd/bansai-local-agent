# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: bonsai-thinker
    model: bonsai-2-27b
    reasoningEffort: medium
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: development
    process: standard
    completion: completed
    usage: detailed
    developerTools: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: llm-pi-ai
  config:
    providers:
      bonsai-thinker:
        apiKey: local
        api: openai-completions
        baseURL: http://localhost:8080/v1
        displayName: Bonsai 2 27B (Thinker 🧠)
        reasoning: high
        models:
          - id: bonsai-2-27b
            displayName: Bonsai 2 27B (Thinker)
            contextWindow: 65536
            maxTokens: 16384
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              medium: medium
              high: high
              max: xhigh
        apiKeyEnv: BONSAI_THINKER_API_KEY
      bonsai-executor:
        apiKey: local
        api: openai-completions
        baseURL: http://localhost:8080/v1
        displayName: Bonsai 2 27B (Executor)
        models:
          - id: bonsai-2-27b
            displayName: Bonsai 2 27B (Executor)
            contextWindow: 32768
            maxTokens: 24576
            input:
              - text
              - image
        apiKeyEnv: BONSAI_EXECUTOR_API_KEY
      bonsai-analyst:
        apiKey: local
        api: openai-completions
        baseURL: http://localhost:8080/v1
        displayName: Bonsai 2 27B (Analyst)
        reasoning: medium
        models:
          - id: bonsai-2-27b
            displayName: Bonsai 2 27B (Analyst)
            contextWindow: 32768
            maxTokens: 24576
            input:
              - text
              - image
            reasoningEfforts:
              off: off
              medium: medium
              high: high
        apiKeyEnv: BONSAI_ANALYST_API_KEY
